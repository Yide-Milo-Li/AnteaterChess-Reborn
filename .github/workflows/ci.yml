name: Build, test and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-3-dev librsvg2-common python3 xvfb
      - name: Core without GTK
        run: make -j4 BUILD=build/no-gtk test GTK_CFLAGS= GTK_LIBS= GLIB_CFLAGS=
      - name: Release and desktop tests
        run: |
          make -j4 CONFIG=release test gui check
          xvfb-run -a make CONFIG=release test-gui
      - name: Sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          make -j4 CONFIG=sanitize test
          ASAN_OPTIONS=detect_leaks=0:halt_on_error=1 xvfb-run -a make -j4 CONFIG=sanitize test-gui
      - name: Packages and rebuild
        run: |
          make -s CONFIG=release benchmark > build/performance.txt
          make CONFIG=release package-source package
          xvfb-run -a python3 tools/verify.py
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
            build/performance.txt
  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gtk3
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-python
      - name: Core without GTK
        run: make -j4 BUILD=build/no-gtk test GTK_CFLAGS= GTK_LIBS= GLIB_CFLAGS=
      - name: Release and desktop tests
        run: |
          make -j4 CONFIG=release test gui check
          make CONFIG=release test-gui
      - name: Packages and rebuild
        run: |
          make -s CONFIG=release benchmark > build/performance.txt
          make CONFIG=release package-source package
          python3 tools/verify.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS
            build/performance.txt
