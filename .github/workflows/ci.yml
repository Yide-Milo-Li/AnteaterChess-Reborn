name: Build, test and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build python3 xvfb qt6-base-dev qt6-declarative-dev qt6-svg-dev qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-window qml6-module-qtquick-templates qml6-module-qtqml-workerscript qml6-module-qttest
      - name: Core without Qt
        run: make -j4 BUILD=build/no-qt test
      - name: Release and desktop tests
        run: |
          make -j4 CONFIG=release test gui test-platform check
          xvfb-run -a make CONFIG=release test-gui
      - name: Sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          make -j4 CONFIG=sanitize test
          ASAN_OPTIONS=detect_leaks=0:halt_on_error=1 xvfb-run -a make -j4 CONFIG=sanitize test-gui
      - name: Packages and rebuild
        run: |
          make -s CONFIG=release benchmark > build/performance.txt
          make CONFIG=release package-source package
          xvfb-run -a python3 tools/packaging/verify.py
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
            build/performance.txt
  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-python
      - name: Core without Qt
        run: make -j4 BUILD=build/no-qt test
      - name: Release and desktop tests
        run: |
          make -j4 CONFIG=release test gui test-platform check
          make CONFIG=release test-gui
      - name: Packages and rebuild
        run: |
          make -s CONFIG=release benchmark > build/performance.txt
          make CONFIG=release package-source package
          python3 tools/packaging/verify.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS
            build/performance.txt
