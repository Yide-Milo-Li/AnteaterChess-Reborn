name: Native build, test and candidates
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Ubuntu system Qt and tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build python3 xvfb qt6-base-dev qt6-declarative-dev qt6-svg-dev qt6-shadertools-dev qt6-shader-baker qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-window qml6-module-qtquick-templates qml6-module-qtqml-workerscript qml6-module-qttest
      - name: Build, test, package and no-Git rebuild
        run: xvfb-run -a -s '-screen 0 2560x1600x24' python3 tools/packaging/ci_checks.py linux
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-${{ github.sha }}
          path: |
            dist/*
            build/ci-evidence
  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Ensure pinned v143 component
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $component = 'Microsoft.VisualStudio.Component.VC.14.44.17.14.x86.x64'
          $present = @(& $vswhere -all -products '*' -requires $component -property installationPath)
          if ($present.Count -eq 0) {
            $instance = & $vswhere -latest -products '*' -property installationPath
            $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
            $process = Start-Process -FilePath $installer -ArgumentList @('modify','--installPath',('"' + $instance + '"'),'--add',$component,'--quiet','--wait','--norestart') -WindowStyle Hidden -PassThru -Wait
            if ($process.ExitCode -ne 0) { throw "v143 installer exit $($process.ExitCode); 3010 requires a fresh post-reboot gate." }
          }
      - name: Install official Qt archive kit
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.2'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtshadertools
          dir: 'C:\'
          cache: false
      - name: Initialize and verify native candidates
        run: |
          . ./tools/native/Enter-NativeEnvironment.ps1 -QtRoot $env:QT_ROOT_DIR -RequireQt -RequirePython
          python -X utf8 tools/packaging/ci_checks.py windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-${{ github.sha }}
          path: |
            dist/*
            build/ci-evidence
